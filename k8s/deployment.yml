apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-website
  labels:
    app: gaming-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaming-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gaming-website
    spec:
      containers:
        - name: gaming-website
          image: IMAGE_PLACEHOLDER      # replaced by the pipeline
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
